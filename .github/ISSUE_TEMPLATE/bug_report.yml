name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! **Do not include real banking data** (IBANs, login names, PINs, TANs, balances or transaction texts). For security issues, follow SECURITY.md instead of opening an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Budgie version
      description: Image tag or commit, e.g. `latest`, `1.0.0` or `sha-89f1785`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - FinTS bank sync
        - CSV import
        - Categorization / AI
        - Rules
        - Overview / budget month
        - Installation / Docker
        - Other
    validations:
      required: true
  - type: input
    id: bank
    attributes:
      label: Bank and TAN mechanism
      description: Only for FinTS issues, e.g. "ING, app approval".
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `docker compose logs api`. Remove any personal data before posting.
      render: text
