# Install once with `pip install pre-commit && pre-commit install`.
# Run on everything with `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(png|svg)$
      - id: end-of-file-fixer
        exclude: \.(png|svg)$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Keep the ruff version in sync with backend/requirements-dev.txt.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Frontend hooks use the tools from `npm ci` in frontend/.
  - repo: local
    hooks:
      - id: frontend-prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx --no-install prettier --check .'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx --no-install eslint .'
        language: system
        files: ^frontend/
        pass_filenames: false
